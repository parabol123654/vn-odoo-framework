# Part 15 §27. Install once with: pre-commit install
default_language_version:
    python: python3.8

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.2.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix=lf]
          # Catches malformed views and templates before Odoo ever loads them.
          - id: check-xml
          - id: check-yaml
          - id: check-merge-conflict

    - repo: https://github.com/psf/black
      rev: 22.3.0
      hooks:
          - id: black

    - repo: https://github.com/PyCQA/isort
      rev: 5.10.1
      hooks:
          - id: isort

    - repo: https://github.com/PyCQA/flake8
      rev: 4.0.1
      hooks:
          - id: flake8

    - repo: https://github.com/OCA/pylint-odoo
      rev: v7.0.2
      hooks:
          - id: pylint_odoo
            args: [--rcfile=.pylintrc]

    # The architecture rule from Part 2 §6, enforced rather than trusted.
    - repo: local
      hooks:
          - id: domain-has-no-odoo-import
            name: Domain layer must not import odoo
            entry: python3 scripts/run_domain_tests.py
            language: system
            pass_filenames: false
            files: ^vn_core/(core|dto|domain)/
