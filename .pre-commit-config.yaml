default_language_version:
    python: python3

# Vendored third-party code (OCA's account_asset_management as
# vn_account_asset) keeps its upstream formatting.
exclude: ^vn_account_asset/

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.2.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix=lf]
          # Catches malformed views and templates before Odoo ever loads them.
          - id: check-xml
          - id: check-yaml
          - id: check-merge-conflict

    - repo: https://github.com/psf/black
      rev: 24.10.0
      hooks:
          - id: black

    - repo: https://github.com/PyCQA/isort
      rev: 5.13.2
      hooks:
          - id: isort

    - repo: https://github.com/PyCQA/flake8
      rev: 7.5.0
      hooks:
          - id: flake8

    - repo: https://github.com/OCA/pylint-odoo
      rev: v9.0.6
      hooks:
          - id: pylint_odoo
            args: [--rcfile=.pylintrc, --disable=import-error]
